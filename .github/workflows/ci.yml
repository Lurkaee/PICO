name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python bytecode compilation
        run: |
          python -m compileall -q pico tests tools

      - name: Check git formatting and whitespace
        shell: pwsh
        run: |
          if ($env:GITHUB_BASE_REF) {
            Write-Host "Checking pull request diff against origin/$env:GITHUB_BASE_REF"
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD"
          } else {
            $count = [int](git rev-list --count HEAD)
            if ($count -gt 1) {
              Write-Host "Checking push diff against HEAD~1"
              git diff --check HEAD~1...HEAD
            } else {
              Write-Host "Initial commit, checking working tree"
              git diff --check
            }
          }

      - name: Run test suite
        run: |
          pytest -v
