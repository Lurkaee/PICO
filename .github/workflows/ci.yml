name: CI

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python bytecode compilation
        run: |
          python -m compileall -q pico tests tools

      - name: Check git formatting and whitespace
        shell: pwsh
        run: |
          if ($env:GITHUB_BASE_REF) {
            Write-Host "Checking pull request diff against origin/$env:GITHUB_BASE_REF"
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD"
          } else {
            $count = [int](git rev-list --count HEAD)
            if ($count -gt 1) {
              Write-Host "Checking push diff against HEAD~1"
              git diff --check HEAD~1...HEAD
            } else {
              Write-Host "Initial commit, checking working tree"
              git diff --check
            }
          }

      - name: Run test suite
        run: |
          pytest -v

  frontend:
    name: Frontend (Node 22)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: "10"
          run_install: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: pnpm run test

      - name: Build production bundle
        working-directory: frontend
        run: pnpm run build

  desktop:
    name: Desktop Shell (Windows MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            frontend/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path frontend/src-tauri/Cargo.toml

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Set up Python for native backend supervision
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Create Python virtual environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          pip install -r requirements.txt

      - name: Stage Windows runtime bundle
        run: .\.venv\Scripts\python.exe tools/packaging/stage_windows_bundle.py

      - name: Run Cargo tests
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml -- --test-threads 1

      - name: Build frontend production bundle
        working-directory: frontend
        run: pnpm run build

      - name: Build desktop shell binary (headless release build)
        run: cargo build --manifest-path frontend/src-tauri/Cargo.toml --release --features tauri/custom-protocol

  windows-installer:
    name: Windows Installer & Qualification (NSIS)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            frontend/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Set up Python 3.12 for runtime staging
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify or install NSIS toolchain
        shell: powershell
        run: |
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (Test-Path "$nsisDir\makensis.exe") {
              $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              choco install nsis -y
              if (Test-Path "$nsisDir\makensis.exe") {
                $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              }
            }
          }
          & "$nsisDir\makensis.exe" /VERSION

      - name: Stage embeddable CPython 3.12 and Core runtime payload
        run: python tools/packaging/stage_windows_bundle.py

      - name: Build unsigned Windows NSIS installer
        working-directory: frontend
        run: pnpm exec tauri build --bundles nsis

      - name: Qualify installed PICO NSIS package (clean install, runtime, RAM, uninstall)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/packaging/qualify_windows_installer.ps1

      - name: Upload NSIS installer and qualification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pico-windows-nsis-installer
          if-no-files-found: warn
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*-setup.exe
            frontend/src-tauri/staged/staging-manifest.json
            frontend/src-tauri/staged/installer-qualification-report.json
