name: CI

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python bytecode compilation
        run: |
          python -m compileall -q pico tests tools

      - name: Check git formatting and whitespace
        shell: pwsh
        run: |
          if ($env:GITHUB_BASE_REF) {
            Write-Host "Checking pull request diff against origin/$env:GITHUB_BASE_REF"
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD"
          } else {
            $count = [int](git rev-list --count HEAD)
            if ($count -gt 1) {
              Write-Host "Checking push diff against HEAD~1"
              git diff --check HEAD~1...HEAD
            } else {
              Write-Host "Initial commit, checking working tree"
              git diff --check
            }
          }

      - name: Run test suite
        run: |
          pytest -v

  frontend:
    name: Frontend (Node 22)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: pnpm run test

      - name: Build production bundle
        working-directory: frontend
        run: pnpm run build
