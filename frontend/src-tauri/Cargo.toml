[package]
name = "pico-desktop"
version = "0.1.0"
description = "PICO Desktop Companion"
authors = ["PICO Team"]
edition = "2021"

[lib]
name = "pico_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["tray-icon"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
